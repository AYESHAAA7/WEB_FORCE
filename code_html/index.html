
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="NEXORA — Discover premium essentials with futuristic style.">
<meta name="theme-color" content="#faf6ee">
<title>NEXORA | Premium Tech &amp; Lifestyle Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--purple:#7c5cd6;--bg:#faf6ee;--card:#ffffff}
html{scroll-behavior:smooth}
body{
 font-family:'Inter',system-ui,-apple-system,Arial,sans-serif;
 background:var(--bg);color:#3b3327;min-height:100vh;
 background-image:radial-gradient(ellipse at top,#f3ecdc 0%,#faf6ee 55%);
 -webkit-font-smoothing:antialiased;
}
::selection{background:#7c5cd633;color:#3b3327}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{background:#ddd2bc;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#cbc0a6}
header{
 position:sticky;top:0;z-index:20;
 display:flex;justify-content:space-between;align-items:center;
 gap:15px;padding:16px 7%;flex-wrap:wrap;
 background:#faf6eeeb;border-bottom:1px solid #3b332714;
 backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
}
.logo{
 font-family:'Space Grotesk','Inter',sans-serif;
 font-size:26px;font-weight:700;letter-spacing:2px;
}
.logo span{color:var(--purple)}
nav{display:flex;gap:26px}
nav a{color:#7a7265;font-size:14px;font-weight:500;text-decoration:none;position:relative;transition:color .25s}
nav a::after{
 content:"";position:absolute;left:0;bottom:-4px;height:2px;width:0;
 border-radius:2px;background:var(--purple);transition:width .25s;
}
nav a:hover{color:#3b3327}
nav a:hover::after{width:100%}
.actions{display:flex;gap:10px;align-items:center}
#cartBtn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px}
input{
 background:#3b33270a;border:1px solid #3b332722;color:#3b3327;
 padding:12px 16px;border-radius:25px;outline:none;min-width:0;
 font:inherit;transition:border-color .25s,box-shadow .25s;
}
input::placeholder{color:#a89d89}
input:focus{border-color:#7c5cd680;box-shadow:0 0 0 3px #7c5cd61a}
button{
 cursor:pointer;border:0;border-radius:12px;padding:12px 20px;
 font:inherit;font-weight:700;
 background:linear-gradient(135deg,#9b7be7,#7c4fd0);color:#fff;
 box-shadow:0 6px 18px #7c5cd62e;
 transition:transform .25s,box-shadow .25s,filter .25s;
}
button:hover{transform:translateY(-2px);box-shadow:0 10px 26px #7c5cd645;filter:brightness(1.04)}
button:active{transform:translateY(0)}
button:focus-visible,input:focus-visible,nav a:focus-visible{
 outline:2px solid var(--purple);outline-offset:2px;
}
.hero{text-align:center;padding:80px 20px 60px}
.tag{
 color:var(--purple);border:1px solid #7c5cd666;border-radius:30px;
 padding:9px 18px;display:inline-block;font-size:11px;
 letter-spacing:2.5px;font-weight:500;background:#7c5cd612;
}
.hero h1{
 font-family:'Space Grotesk','Inter',sans-serif;
 font-size:clamp(38px,7vw,76px);line-height:1.08;letter-spacing:-1px;
 margin:28px 0 18px;
}
.hero h1 span{
 background:linear-gradient(90deg,#7c5cd6,#0d9488);
 -webkit-background-clip:text;color:transparent;
}
.hero p{color:#7d7466;line-height:1.75;max-width:480px;margin:0 auto 30px;font-size:16px}
.hero button{padding:15px 34px;border-radius:30px;font-size:15px}
.section{padding:25px 7% 70px;scroll-margin-top:80px}
.section-head{
 display:flex;justify-content:space-between;align-items:center;
 gap:15px;margin-bottom:28px;flex-wrap:wrap
}
.section-head h2{font-family:'Space Grotesk','Inter',sans-serif;font-size:28px;letter-spacing:-.5px}
#count{background:#ffffff36;color:#fff;padding:2px 9px;border-radius:20px;font-size:13px;font-weight:700}
.grid{
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:23px;
 perspective:1000px;
}
.card{
 background:linear-gradient(145deg,#ffffff,#f8f2e6);
 border:1px solid #3b332712;border-radius:20px;overflow:hidden;
 transition:transform .35s,border-color .35s,box-shadow .35s;
 transform-style:preserve-3d;
 animation:rise .5s ease backwards;
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.card:hover{
 transform:translateY(-10px) rotateX(3deg) rotateY(-3deg);
 border-color:#7c5cd680;
 box-shadow:0 20px 45px #6b5a3f24,0 0 25px #7c5cd614;
}
.product-image{
 height:210px;position:relative;overflow:hidden;background:#fff;
}
.product-image img{
 width:100%;height:100%;object-fit:cover;transition:transform .5s;
}
.card:hover .product-image img{transform:scale(1.09)}
.badge{
 position:absolute;top:12px;left:12px;background:var(--purple);
 color:#fff;padding:7px 10px;border-radius:20px;
 font-size:11px;font-weight:bold;
}
.info{padding:18px}
.category{color:#8e8373;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.info h3{font-family:'Space Grotesk','Inter',sans-serif;font-size:19px;font-weight:500;margin:9px 0}
.stars{color:#eab308;font-size:14px;margin-bottom:12px}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-size:21px;font-weight:700;color:#7050c0;font-variant-numeric:tabular-nums}
.add{padding:11px 13px;font-size:18px}
.empty{grid-column:1/-1;text-align:center;color:#8e8373;padding:50px}
footer{
 text-align:center;padding:34px 15px;border-top:1px solid #3b332714;
 color:#9a8f7c;font-size:13px;scroll-margin-top:60px;
}
#toast{
 position:fixed;bottom:25px;left:50%;transform:translate(-50%,100px);
 background:#3b3327;color:#faf6ee;padding:14px 24px;border-radius:12px;
 font-weight:700;font-size:14px;box-shadow:0 14px 38px #6b5a3f33;
 opacity:0;transition:transform .35s,opacity .35s;z-index:30;
}
#toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:550px){
 header{justify-content:center}
 nav{order:3;width:100%;justify-content:center}
 .actions{width:100%}.actions input{flex:1}
 .grid{grid-template-columns:1fr 1fr;gap:12px}
 .product-image{height:145px}.info{padding:12px}
 .info h3{font-size:15px}.price{font-size:16px}
 .add{padding:9px}.hero{padding-top:55px}
}
@media(max-width:350px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
 <div class="logo">NEX<span>ORA</span></div>
 <nav>
  <a href="#">Home</a>
  <a href="#shop">Shop</a>
  <a href="#footer">About</a>
 </nav>
 <div class="actions">
  <input id="search" type="search" placeholder="Search products..." aria-label="Search products">
  <button id="cartBtn" aria-label="View cart">
   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
   <span id="count">0</span>
  </button>
 </div>
</header>

<section class="hero">
 <span class="tag">✦ THE FUTURE OF SHOPPING</span>
 <h1>Upgrade Your <span>Everyday.</span></h1>
 <p>Discover premium essentials with futuristic style.<br>
 Your next favorite thing is just one click away.</p>
 <button onclick="document.querySelector('#shop').scrollIntoView({behavior:'smooth'})">
  Explore Collection ↗
 </button>
</section>

<section class="section" id="shop">
 <div class="section-head">
  <h2>Featured Products <span style="color:#7c5cd6">✦</span></h2>
  <span id="resultText" style="color:#8e8373">4 products</span>
 </div>
 <div class="grid" id="grid"></div>
</section>

<footer id="footer">
 <div class="logo">NEX<span>ORA</span></div>
 <p style="margin-top:12px">Designed for tomorrow. Made for you.</p>
 <p style="margin-top:14px;color:#a89d89">© 2026 NEXORA Store. All rights reserved.</p>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const products = [
 {id:1,name:"Air Sneakers",category:"Footwear",price:89,
  badge:"BESTSELLER",rating:4.9,
  image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"},
 {id:2,name:"Studio Headphones",category:"Audio",price:129,
  badge:"POPULAR",rating:4.8,
  image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"},
 {id:3,name:"Minimal Watch",category:"Accessories",price:159,
  badge:"PREMIUM",rating:4.9,
  image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600"},
 {id:4,name:"Urban Handbag",category:"Fashion",price:99,
  badge:"NEW",rating:4.7,
  image:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=600"}
];

let cart = [];
let query = "";

const grid = document.getElementById("grid");
const count = document.getElementById("count");
const resultText = document.getElementById("resultText");
const toast = document.getElementById("toast");

function render(){
 const filtered = products.filter(p =>
  (p.name+" "+p.category).toLowerCase().includes(query.toLowerCase())
 );
 resultText.textContent = filtered.length + " products";

 if(!filtered.length){
  grid.innerHTML='<div class="empty">No products found. Try another search.</div>';
  return;
 }

 grid.innerHTML = filtered.map(p => `
  <article class="card">
   <div class="product-image">
    <img src="${p.image}" alt="${p.name}" loading="lazy" decoding="async">
    <span class="badge">${p.badge}</span>
   </div>
   <div class="info">
    <div class="category">${p.category}</div>
    <h3>${p.name}</h3>
    <div class="stars" aria-label="Rated ${p.rating} out of 5"><span aria-hidden="true">★★★★★</span> <span style="color:#8e8373">${p.rating}</span></div>
    <div class="bottom">
     <span class="price">$${p.price}</span>
     <button class="add" data-add="${p.id}" aria-label="Add ${p.name} to cart">＋</button>
    </div>
   </div>
  </article>
 `).join("");
}

function updateCart(){
 count.textContent = cart.reduce((sum,item)=>sum+item.qty,0);
}

let toastTimer;
function notify(message){
 toast.textContent=message;
 toast.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>toast.classList.remove("show"),2000);
}

grid.addEventListener("click",event=>{
 const btn=event.target.closest("[data-add]");
 if(!btn)return;
 const product=products.find(p=>p.id===Number(btn.dataset.add));
 const existing=cart.find(item=>item.id===product.id);
 if(existing)existing.qty++;
 else cart.push({...product,qty:1});
 updateCart();
 notify(product.name+" added to cart!");
});

document.getElementById("search").addEventListener("input",event=>{
 query=event.target.value;
 render();
});

document.getElementById("cartBtn").addEventListener("click",()=>{
 if(!cart.length){
  notify("Your cart is empty.");
  return;
 }
 const summary=cart.map(item=>
  item.name+" × "+item.qty+" = $"+(item.price*item.qty)
 ).join("\n");
 const total=cart.reduce((sum,item)=>sum+item.price*item.qty,0);
 alert("YOUR SHOPPING CART\n\n"+summary+"\n\nTotal: $"+total);
});

render();
</script>
</body>
</html>
